[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "mantispy"
version = "0.0.1"
description = "Image-based profiling on AnnData"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Tim Treis", email = "tim.treis@outlook.de" },
  { name = "Lukas Heumos", email = "lukas.heumos@scverse.org" },
]
authors = [
  { name = "Tim Treis" },
  { name = "Lukas Heumos" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "anndata>=0.13",
  "matplotlib>=3.9",
  "numba>=0.60",
  "numpy>=1.26",
  "pandas>=2.1",
  "platformdirs>=4",
  "pooch>=1.8",
  "scanpy>=1.12",
  "scipy>=1.11",
  "scverse-misc[datasets]>=0.1.6",
  # for debug logging (referenced from the issue template)
  "session-info2",
]
# Reading images and segmentations needs the spatial stack; reading profiles does not.
optional-dependencies.spatial = [
  "dask>=2024.4",
  "geopandas>=1",
  "h5py>=3.10",
  "imagecodecs>=2024.1",
  "imageio>=2.34",
  "pyarrow>=16",
  "scikit-image>=0.24",
  "shapely>=2",
  "spatialdata>=0.3",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://mantispy.readthedocs.io/"
urls.Homepage = "https://github.com/scverse/mantispy"
urls.Source = "https://github.com/scverse/mantispy"

[dependency-groups]
dev = [
  "twine>=4.0.2",
]
test = [
  "coverage>=7.10",
  # The io tests build gallery and CellProfiler-export trees on disk, which needs the spatial stack.
  "mantispy[spatial]",
  # Reference implementations, used only to assert equivalence. Never imported from src/.
  "pycytominer==1.7.1",
  "pytest",
  "pytest-cov",         # For VS Code’s coverage functionality
]
doc = [
  "ipykernel",
  "ipython",
  # the API page documents the spatial readers, which autosummary has to import
  "mantispy[spatial]",
  "myst-nb>=1.1",
  "pandas",
  "scverse-misc[sphinx]>=0.1.6",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxext-opengraph",
]
typecheck = [
  "mypy",
  "pandas-stubs",
]

[tool.hatch]
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.dependency-groups = [ "doc" ]
envs.hatch-check-code.dependencies = [ "prek" ]
envs.hatch-check-code.scripts.lint-check = "echo 'try `hatch check code --fix`'; false"
envs.hatch-check-code.scripts.lint-fix = "prek run -a --no-group=format --no-group=typecheck"
envs.hatch-check-fmt.dependencies = [ "prek" ]
envs.hatch-check-fmt.scripts.format-check = "echo 'try `hatch check fmt --fix`'; false"
envs.hatch-check-fmt.scripts.format-fix = "prek run -a --group=format --no-group=typecheck"
envs.hatch-check-types.scripts.check = [ "mypy" ]
envs.hatch-check-types.dependency-groups = [ "typecheck", "test" ]
envs.hatch-test.matrix = [
  # Test the lowest and highest supported Python versions with normal deps
  { deps = [ "stable" ], python = [ "3.12", "3.13" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.13" ] },
]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]
envs.hatch-test.dependency-groups = [ "dev", "test" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "google"

[tool.mypy]
files = [ "src", "tests" ]

# the image and spatial stack ships no type information
[[tool.mypy.overrides]]
module = [
  "dask.*",
  "geopandas.*",
  "h5py.*",
  "imageio.*",
  "scipy.*",
  "shapely.*",
  "skimage.*",
  "spatialdata.*",
]
ignore_missing_imports = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "tests" ]
ini_options.addopts = [
  "--import-mode=importlib", # allow using test files with same name
  "-m not network",          # run the downloads with `pytest -m network`
]
ini_options.markers = [
  "network: requires network access (deselect with -m 'not network')",
  "slow: long-running integration test",
]
ini_options.strict = true

[tool.coverage]
run.source = [ "mantispy" ]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]

[tool.cruft]
skip = [
  ".git",
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
